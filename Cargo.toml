[package]
name = "omarchy-yapperd"
version = "0.10.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "End-to-end encrypted Matrix daemon behind the Yapper plugin"
repository = "https://github.com/marcho78/omarchy-yapperd"

[[bin]]
name = "omarchy-yapperd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
imagesize = "0.13"
libc = "0.2"
mime = "0.3"
mime2ext = "0.1"
mime_guess = "2"
# Default features: e2e-encryption, automatic-room-key-forwarding, sqlite, rustls.
# local-server: loopback HTTP listener for the OAuth redirect.
matrix-sdk = { version = "0.19", features = ["local-server"] }
matrix-sdk-base = "0.19"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "fs"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
