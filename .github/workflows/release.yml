# Builds the daemon for each tagged release and attaches it to the GitHub
# release, so that packaging/bin/PKGBUILD can install it without a compile.
#
# Only GitHub's own actions are used, each pinned to a commit. The build runs on GitHub-hosted Ubuntu
# runners (x86_64 and aarch64); the binary links glibc and the system sqlite,
# both older on the runner than on Arch, so it runs on any current Arch.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write      # create the release and upload the tarballs
  id-token: write      # sign the build provenance attestation
  attestations: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          # rust-toolchain.toml pins the exact release; rustup installs it.
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update -q
          sudo apt-get install -y -q libsqlite3-dev
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked
      - name: Tarball
        id: tar
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not $version" >&2; exit 1; }
          name="omarchy-yapperd-$version-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/omarchy-yapperd omarchy-yapperd.service LICENSE README.md "$name/"
          strip "$name/omarchy-yapperd"
          tar --owner=0 --group=0 --numeric-owner -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.tar.outputs.file }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.arch }}
          path: ${{ steps.tar.outputs.file }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "omarchy-yapperd ${tag#v}" --notes "See CHANGELOG.md for ${tag#v}."
          gh release upload "$tag" --clobber dist/*.tar.gz dist/SHA256SUMS
